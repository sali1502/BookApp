<div class="container my-4">
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
    <div>
      <h2 class="fw-bold mb-1"><i class="fa-solid fa-books text-primary me-2"></i>Boklista</h2>
      <p class="text-muted mb-0">Hantera alla registrerade böcker.</p>
    </div>
    <a routerLink="/books/add" class="btn btn-primary d-flex align-items-center gap-2">
      <i class="fa-solid fa-plus"></i> Lägg till ny bok
    </a>
  </div>

  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Laddar...</span>
    </div>
    <p class="mt-2 text-muted">Hämtar böcker...</p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && books.length === 0" class="text-center my-5 p-5 card border-dashed">
    <i class="fa-solid fa-book-open display-1 text-muted mb-3"></i>
    <h4>Inga böcker hittades</h4>
    <p class="text-muted">Klicka på knappen ovan för att lägga till din första bok!</p>
  </div>

  <div *ngIf="!isLoading && books.length > 0" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let book of books">
      <div class="card h-100 shadow-sm border-0 position-relative">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center gap-2 mb-2 text-primary">
            <i class="fa-solid fa-book fs-4"></i>
            <h5 class="card-title fw-bold mb-0 text-truncate" [title]="book.title">{{ book.title }}</h5>
          </div>
          <h6 class="card-subtitle mb-3 text-muted">
            <i class="fa-solid fa-user-pen me-1"></i> {{ book.author }}
          </h6>
          <p class="card-text text-muted mb-4 small">
            <i class="fa-solid fa-calendar-days me-1"></i>
            Publiceringsdatum: {{ book.publishDate | date:'yyyy-MM-dd' }}
          </p>

          <div class="mt-auto pt-3 border-top d-flex justify-content-end gap-2">
            <a [routerLink]="['/books/edit', book.id]" class="btn btn-outline-primary btn-sm">
              <i class="fa-solid fa-pen-to-square me-1"></i> Redigera
            </a>
            <button (click)="deleteBook(book.id)" class="btn btn-outline-danger btn-sm">
              <i class="fa-solid fa-trash me-1"></i> Radera
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
