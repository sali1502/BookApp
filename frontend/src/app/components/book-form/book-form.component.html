<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-sm-5">
          <div class="d-flex align-items-center justify-content-between mb-4">
            <h3 class="fw-bold mb-0">
              <i class="fa-solid" [class.fa-plus-circle]="!isEditMode" [class.fa-pen-to-square]="isEditMode"></i>
              {{ isEditMode ? 'Redigera bok' : 'Lägg till ny bok' }}
            </h3>
            <a routerLink="/" class="btn btn-outline-secondary btn-sm">
              <i class="fa-solid fa-arrow-left me-1"></i> Tillbaka
            </a>
          </div>

          <div class="alert alert-danger" *ngIf="errorMessage" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i> {{ errorMessage }}
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="title" class="form-label fw-bold">Titel</label>
              <input
                type="text"
                id="title"
                class="form-control"
                [(ngModel)]="title"
                name="title"
                placeholder="Ange bokens titel"
                required
              />
            </div>

            <div class="mb-3">
              <label for="author" class="form-label fw-bold">Författare</label>
              <input
                type="text"
                id="author"
                class="form-control"
                [(ngModel)]="author"
                name="author"
                placeholder="Ange författarens namn"
                required
              />
            </div>

            <div class="mb-4">
              <label for="publishDate" class="form-label fw-bold">Publiceringsdatum</label>
              <input
                type="date"
                id="publishDate"
                class="form-control"
                [(ngModel)]="publishDate"
                name="publishDate"
                required
              />
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a routerLink="/" class="btn btn-secondary">Avbryt</a>
              <button type="submit" class="btn btn-primary" [disabled]="isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                <i class="fa-solid fa-floppy-disk me-1" *ngIf="!isLoading"></i>
                Spara bok
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
