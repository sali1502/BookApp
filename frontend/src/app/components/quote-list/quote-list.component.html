<div class="container my-4">
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
    <div>
      <h2 class="fw-bold mb-1"><i class="fa-solid fa-quote-left text-primary me-2"></i>Mina Citat</h2>
      <p class="text-muted mb-0">Samling av mina favoritcitat och klokheter.</p>
    </div>
    <button (click)="openAddForm()" class="btn btn-primary d-flex align-items-center gap-2" *ngIf="!showForm">
      <i class="fa-solid fa-plus"></i> Lägg till citat
    </button>
  </div>

  <!-- Form for Adding / Editing Quote -->
  <div class="card shadow-sm border-0 mb-4" *ngIf="showForm">
    <div class="card-body p-4">
      <h4 class="fw-bold mb-3">
        <i class="fa-solid" [class.fa-plus-circle]="!editingQuoteId" [class.fa-pen-to-square]="editingQuoteId"></i>
        {{ editingQuoteId ? 'Redigera citat' : 'Lägg till nytt citat' }}
      </h4>
      <div class="mb-3">
        <label for="quoteText" class="form-label fw-bold">Citat</label>
        <textarea
          id="quoteText"
          class="form-control"
          rows="3"
          [(ngModel)]="text"
          placeholder="Ange citatet..."
        ></textarea>
      </div>
      <div class="mb-3">
        <label for="quoteAuthor" class="form-label fw-bold">Upphovsperson / Författare</label>
        <input
          type="text"
          id="quoteAuthor"
          class="form-control"
          [(ngModel)]="author"
          placeholder="T.ex. Albert Einstein"
        />
      </div>
      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-secondary" (click)="cancelForm()">Avbryt</button>
        <button class="btn btn-primary" (click)="saveQuote()">
          <i class="fa-solid fa-floppy-disk me-1"></i> Spara citat
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Laddar...</span>
    </div>
    <p class="mt-2 text-muted">Hämtar citat...</p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && quotes.length === 0" class="text-center my-5 p-5 card border-dashed">
    <i class="fa-solid fa-quote-right display-1 text-muted mb-3"></i>
    <h4>Inga citat sparade än</h4>
    <p class="text-muted">Klicka på knappen ovan för att lägga till ditt första citat!</p>
  </div>

  <div *ngIf="!isLoading && quotes.length > 0" class="row row-cols-1 row-cols-md-2 g-4">
    <div class="col" *ngFor="let quote of quotes">
      <div class="card h-100 shadow-sm border-0 position-relative">
        <div class="card-body d-flex flex-column p-4">
          <i class="fa-solid fa-quote-left text-primary opacity-25 display-4 mb-2"></i>
          <blockquote class="blockquote mb-4 quote-content">
            <p class="fs-5 fst-italic">"{{ quote.text }}"</p>
            <footer class="blockquote-footer mt-2 text-end fw-bold">
              <cite [title]="quote.author">{{ quote.author }}</cite>
            </footer>
          </blockquote>

          <div class="pt-3 border-top d-flex justify-content-end gap-2">
            <button (click)="openEditForm(quote)" class="btn btn-outline-primary btn-sm">
              <i class="fa-solid fa-pen-to-square me-1"></i> Redigera
            </button>
            <button (click)="deleteQuote(quote.id)" class="btn btn-outline-danger btn-sm">
              <i class="fa-solid fa-trash me-1"></i> Radera
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
